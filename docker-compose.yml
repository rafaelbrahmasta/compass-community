services:
  db:
    image: postgres:16-alpine
    container_name: compass_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: compass
      POSTGRES_PASSWORD: compass123
      POSTGRES_DB: compass_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compass -d compass_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: compass_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://compass:compass123@db:5432/compass_db
      JWT_SECRET: compass_super_secret_jwt_key_sangat_panjang_dan_aman_2026
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: your_email@gmail.com
      SMTP_PASS: your_app_password
      SMTP_FROM: COMPASS <noreply@compass.id>
      ADMIN_EMAIL: admin@compass.id
      ADMIN_PASSWORD: Admin@compass123
      UPLOAD_DIR: /app/uploads
      FRONTEND_URL: http://localhost:5173
      PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: compass_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8080/api/v1
    ports:
      - "5173:80"

volumes:
  pgdata:
    name: compass_pgdata
